# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c9eeb35af488c0978a90b5dab4f7b538"
name = "Ubeauty-tbyb-app"
handle = "ubeauty-tbyb-app"
application_url = "https://measures-wondering-freeze-maintaining.trycloudflare.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,write_orders,read_orders,write_customers,read_customers,write_draft_orders,read_draft_orders,write_fulfillments,read_fulfillments"

[auth]
redirect_urls = [
  "https://measures-wondering-freeze-maintaining.trycloudflare.com/auth/callback",
  "https://measures-wondering-freeze-maintaining.trycloudflare.com/auth/shopify/callback",
  "https://measures-wondering-freeze-maintaining.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false

[[extensions]]
type = "theme_app_extension"
name = "tbyb-extension"
handle = "tbyb-extension"
